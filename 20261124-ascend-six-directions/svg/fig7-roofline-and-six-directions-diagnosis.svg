<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">昇腾 Roofline 模型与跨区间固定开销：六大分析角度诊断示意图</title>
  <desc id="desc">严格按 Roofline 原始定义划分为访存受限斜坡与算力受限屋顶两个主区，并将控制固定开销（方向六）标为可出现在不同算术强度下的底部横贯现象，提示结合 msprof 消费者等待与硬件计数判定瓶颈。</desc>
  <defs>
    <marker id="arr-axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#203d5d"/></marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8c5210"/></marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1d6b55"/></marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1d4f8c"/></marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a32929"/></marker>
  </defs>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
    <rect x="0" y="0" width="1280" height="540" rx="14" fill="#edf3fa"/>
    <text x="28" y="46" font-size="28" font-weight="700" fill="#203d5d">昇腾 Roofline 模型与跨区间固定开销：六大角度诊断示意</text>
    <text x="28" y="74" font-size="16" fill="#526d88">按 Roofline 定义分访存/算力两区；固定控制开销（⑥）可出现在任意算术强度下，须结合 Timeline 等待与硬件计数判定</text>

    <!-- LEFT: Classic 2-zone Roofline + Cross-AI Overhead Band -->
    <rect x="24" y="96" width="844" height="420" rx="14" fill="#ffffff"/>

    <!-- 2 Classic Roofline Zones (x: 92..492 Memory-bound, x: 492..834 Compute-bound) -->
    <rect x="92" y="126" width="400" height="334" fill="#f2fbf7"/>
    <text x="292" y="150" font-size="15" font-weight="700" fill="#1d6b55" text-anchor="middle">访存受限区（Memory-bound）</text>
    <text x="292" y="170" font-size="12" fill="#1d6b55" text-anchor="middle">算术强度低于硬件拐点（AI ＜ P_peak / B_peak）</text>

    <rect x="492" y="126" width="342" height="334" fill="#f3f8ff"/>
    <text x="663" y="150" font-size="15" font-weight="700" fill="#1d4f8c" text-anchor="middle">算力受限区（Compute-bound）</text>
    <text x="663" y="170" font-size="12" fill="#1d4f8c" text-anchor="middle">算术强度高于硬件拐点（AI ≥ P_peak / B_peak）</text>

    <!-- Ridge vertical divider -->
    <line x1="492" y1="126" x2="492" y2="460" stroke="#8fb8ec" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Cross-AI Horizontal Overhead Phenomenon Band at bottom (y: 396..460 across ALL AI!) -->
    <rect x="92" y="396" width="742" height="64" fill="#fff4df" opacity="0.88"/>
    <line x1="92" y1="396" x2="834" y2="396" stroke="#e5b869" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="463" y="421" font-size="13.5" font-weight="700" fill="#8c5210" text-anchor="middle">跨区间现象：固定控制开销区（⑥ Overhead-bound，可出现在任意算术强度下）</text>
    <text x="463" y="443" font-size="12" fill="#8c5210" text-anchor="middle">小 Batch / 小包 / 碎发射 / Host 回调 / 屏障把实测点压在底部，无法仅凭算术强度 AI 判定，须看 Timeline Gap 与等待</text>

    <!-- Roofline Ceiling: slope from (92, 372) up to ridge (492, 212), then flat to (828, 212) -->
    <!-- Formula on slope: y(x) = 372 - 0.4 * (x - 92) -->
    <polyline points="92,372 492,212 828,212" fill="none" stroke="#203d5d" stroke-width="3.2" stroke-linejoin="round"/>
    <circle cx="492" cy="212" r="5" fill="#203d5d"/>
    <text x="484" y="198" font-size="12" font-weight="700" fill="#203d5d" text-anchor="end">硬件拐点（Ridge）</text>
    <text x="278" y="274" font-size="12.5" font-weight="700" fill="#1d6b55" transform="rotate(-21.8 278 274)">硬件峰值带宽斜线 B_peak</text>
    <text x="676" y="200" font-size="12.5" font-weight="700" fill="#1d4f8c" text-anchor="middle">硬件峰值算力屋顶 P_peak（AIC / AIV）</text>

    <!-- Axes -->
    <line x1="92" y1="460" x2="844" y2="460" stroke="#203d5d" stroke-width="2" marker-end="url(#arr-axis)"/>
    <line x1="92" y1="460" x2="92" y2="116" stroke="#203d5d" stroke-width="2" marker-end="url(#arr-axis)"/>
    <text x="468" y="494" font-size="14" font-weight="700" fill="#203d5d" text-anchor="middle">算术强度 AI = 有效计算量 ÷ 实测 GM 访存字节（示意，由左向右增大）</text>
    <text x="58" y="294" font-size="14" font-weight="700" fill="#203d5d" text-anchor="middle" transform="rotate(-90 58 294)">有效吞吐 / 实测性能（示意）</text>

    <!-- Memory-bound schematic point: x=278 (slope y=297.6), dot at y=368 -->
    <circle cx="278" cy="368" r="6.5" fill="#1d6b55"/>
    <!-- Up arrow: Direction 4 (stops cleanly below slope y=298) -->
    <line x1="278" y1="358" x2="278" y2="310" stroke="#a32929" stroke-width="2.6" marker-end="url(#arr-red)"/>
    <rect x="292" y="294" width="126" height="44" rx="6" fill="#fde4e4" stroke="#f0a6a6" stroke-width="1.4"/>
    <text x="355" y="313" font-size="12" font-weight="700" fill="#a32929" text-anchor="middle">上推 ④ 提访存</text>
    <text x="355" y="330" font-size="10.5" fill="#a32929" text-anchor="middle">对齐/合并/消冲突</text>
    <!-- Right arrow: Direction 2 -->
    <line x1="288" y1="368" x2="344" y2="368" stroke="#1d6b55" stroke-width="2.6" marker-end="url(#arr-green)"/>
    <rect x="350" y="346" width="128" height="44" rx="6" fill="#d9f1e9" stroke="#7ec5af" stroke-width="1.4"/>
    <text x="414" y="365" font-size="12" font-weight="700" fill="#1d6b55" text-anchor="middle">右移 ② 减搬运</text>
    <text x="414" y="382" font-size="10.5" fill="#1d6b55" text-anchor="middle">融合/砍拷贝提 AI</text>

    <!-- Compute-bound schematic point: x=582, dot at y=344, arrow up to y=226 -->
    <circle cx="582" cy="344" r="6.5" fill="#1d4f8c"/>
    <text x="582" y="370" font-size="11.5" font-weight="700" fill="#1d4f8c" text-anchor="middle">典型：Prefill / 大型 GEMM</text>
    <line x1="582" y1="334" x2="582" y2="228" stroke="#1d4f8c" stroke-width="2.6" marker-end="url(#arr-blue)"/>
    <rect x="602" y="258" width="204" height="50" rx="7" fill="#dceaff" stroke="#8fb8ec" stroke-width="1.4"/>
    <text x="704" y="279" font-size="12.5" font-weight="700" fill="#1d4f8c" text-anchor="middle">上推 ③ 提算效 ＋ ⑤ 重叠均衡</text>
    <text x="704" y="298" font-size="11" fill="#1d4f8c" text-anchor="middle">Cube/向量效率、双缓冲、L2 Swizzle</text>

    <!-- Overhead upward push arrows on BOTH low-AI and high-AI sides -->
    <line x1="168" y1="406" x2="168" y2="360" stroke="#8c5210" stroke-width="2.2" marker-end="url(#arr-amber)"/>
    <text x="180" y="382" font-size="11.5" font-weight="700" fill="#8c5210">打 ⑥ 脱底</text>
    <line x1="734" y1="406" x2="734" y2="352" stroke="#8c5210" stroke-width="2.2" marker-end="url(#arr-amber)"/>
    <text x="746" y="380" font-size="11.5" font-weight="700" fill="#8c5210">打 ⑥ 脱底</text>

    <!-- RIGHT: Decision Legend Card -->
    <rect x="886" y="96" width="370" height="420" rx="14" fill="#ffffff"/>
    <text x="908" y="130" font-size="17" font-weight="700" fill="#203d5d">怎么结合 msprof 做日常诊断？</text>

    <rect x="908" y="148" width="326" height="76" rx="9" fill="#fff8eb" stroke="#e5b869"/>
    <text x="922" y="172" font-size="13.5" font-weight="700" fill="#8c5210">1. 先看 Timeline 空白与等待（跨 AI）</text>
    <text x="922" y="194" font-size="12.5" fill="#526d88">单算子仅几 μs、Gap/回调/屏障占比高 →</text>
    <text x="922" y="213" font-size="12.5" fill="#526d88">优先排查 ⑥（无论 AI 高低都可能受控于此）</text>

    <rect x="908" y="238" width="326" height="78" rx="9" fill="#f2fbf7" stroke="#9fd6c3"/>
    <text x="922" y="262" font-size="13.5" font-weight="700" fill="#1d6b55">2. MTE 占比高且消费者确在等搬运</text>
    <text x="922" y="284" font-size="12.5" fill="#526d88">若已被计算掩盖则无需硬抠；确认阻塞后：</text>
    <text x="922" y="303" font-size="12.5" fill="#526d88">带宽利用率低打 ④，接近峰值斜线打 ②</text>

    <rect x="908" y="330" width="326" height="78" rx="9" fill="#f3f8ff" stroke="#93b9ea"/>
    <text x="922" y="354" font-size="13.5" font-weight="700" fill="#1d4f8c">3. 大 Shape / 高算术强度（算力屋顶）</text>
    <text x="922" y="376" font-size="12.5" fill="#526d88">主攻 ③（Cube 分块/向量化/去转换）＋</text>
    <text x="922" y="395" font-size="12.5" fill="#526d88">⑤（Double Buffer、核间均衡）＋ L2 Swizzle</text>

    <rect x="908" y="422" width="326" height="76" rx="9" fill="#fde4e4" stroke="#f0a6a6"/>
    <text x="922" y="446" font-size="13.5" font-weight="700" fill="#a32929">★ 通用降维打击：方向 ① 减少计算量</text>
    <text x="922" y="468" font-size="12.5" fill="#203d5d">砍掉 Padding（18）、反推（14）、排序（06）</text>
    <text x="922" y="487" font-size="12.5" fill="#203d5d">直接缩小总工作量，在两个主区均有效</text>
  </g>
</svg>
