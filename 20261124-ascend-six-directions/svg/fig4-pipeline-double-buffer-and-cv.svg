<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="584" viewBox="0 0 1280 584" role="img" aria-labelledby="title desc">
  <title id="title">方向五图解：核内 Double Buffer 乒乓流水与跨流 CV 错峰重叠</title>
  <desc id="desc">上半区展示 AscendC/Triton 单缓冲串行与 Double Buffer 为三段流水提供重叠条件的示意；下半区对照 sfa_v1.py 交付源码准确展示提交 07 在 Native 与 MLAPO 下的主辅流执行与汇合点。</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6887a7"/></marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a32929"/></marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1d6b55"/></marker>
  </defs>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, PingFang SC, sans-serif">
    <rect x="0" y="0" width="1280" height="584" rx="14" fill="#edf3fa"/>
    <text x="28" y="46" font-size="28" font-weight="700" fill="#203d5d">方向五图解：核内 Double Buffer 流水与跨流 CV 错峰重叠</text>
    <text x="28" y="74" font-size="16" fill="#526d88">通过核内双缓冲和片内主辅流错峰为并行重叠创造条件；窗口过短时须主动做减法省掉跨流同步税</text>

    <!-- UPPER CARD: Double Buffer -->
    <rect x="24" y="96" width="1232" height="236" rx="14" fill="#ffffff"/>
    <text x="44" y="126" font-size="16.5" font-weight="700" fill="#203d5d">一、单算子核内必修课：单缓冲串行 vs Double Buffer（InitBuffer num = 2 / multibuffer）</text>

    <!-- Serial row -->
    <rect x="44" y="142" width="154" height="36" rx="7" fill="#fde4e4"/>
    <text x="121" y="165" font-size="13.5" font-weight="700" fill="#a32929" text-anchor="middle">单缓冲（串行）</text>

    <rect x="212" y="142" width="96" height="36" rx="6" fill="#dceaff" stroke="#8fb8ec"/><text x="260" y="165" font-size="12.5" font-weight="700" fill="#1d4f8c" text-anchor="middle">MTE2 #0</text>
    <rect x="312" y="142" width="96" height="36" rx="6" fill="#e9e2fa" stroke="#bda9ec"/><text x="360" y="165" font-size="12.5" font-weight="700" fill="#5b3b9e" text-anchor="middle">Vec #0</text>
    <rect x="412" y="142" width="96" height="36" rx="6" fill="#fff0d4" stroke="#e5b869"/><text x="460" y="165" font-size="12.5" font-weight="700" fill="#8c5210" text-anchor="middle">MTE3 #0</text>

    <rect x="514" y="142" width="96" height="36" rx="6" fill="#dceaff" stroke="#8fb8ec"/><text x="562" y="165" font-size="12.5" font-weight="700" fill="#1d4f8c" text-anchor="middle">MTE2 #1</text>
    <rect x="614" y="142" width="96" height="36" rx="6" fill="#e9e2fa" stroke="#bda9ec"/><text x="662" y="165" font-size="12.5" font-weight="700" fill="#5b3b9e" text-anchor="middle">Vec #1</text>
    <rect x="714" y="142" width="96" height="36" rx="6" fill="#fff0d4" stroke="#e5b869"/><text x="762" y="165" font-size="12.5" font-weight="700" fill="#8c5210" text-anchor="middle">MTE3 #1</text>

    <rect x="816" y="142" width="96" height="36" rx="6" fill="#dceaff" stroke="#8fb8ec"/><text x="864" y="165" font-size="12.5" font-weight="700" fill="#1d4f8c" text-anchor="middle">MTE2 #2</text>
    <rect x="916" y="142" width="96" height="36" rx="6" fill="#e9e2fa" stroke="#bda9ec"/><text x="964" y="165" font-size="12.5" font-weight="700" fill="#5b3b9e" text-anchor="middle">Vec #2</text>
    <rect x="1016" y="142" width="96" height="36" rx="6" fill="#fff0d4" stroke="#e5b869"/><text x="1064" y="165" font-size="12.5" font-weight="700" fill="#8c5210" text-anchor="middle">MTE3 #2</text>
    <text x="1126" y="165" font-size="12.5" font-weight="700" fill="#a32929">9 拍（引擎互等）</text>

    <!-- Double Buffer 3 lanes -->
    <rect x="44" y="196" width="154" height="106" rx="8" fill="#d9f1e9"/>
    <text x="121" y="236" font-size="14" font-weight="700" fill="#1d6b55" text-anchor="middle">Double Buffer</text>
    <text x="121" y="258" font-size="12" fill="#1d6b55" text-anchor="middle">理想重叠示意</text>
    <text x="121" y="278" font-size="11.5" fill="#526d88" text-anchor="middle">（均等耗时 5 拍）</text>

    <!-- Lane backgrounds -->
    <rect x="212" y="196" width="1020" height="32" rx="5" fill="#f7f9fc"/>
    <rect x="212" y="233" width="1020" height="32" rx="5" fill="#f7f9fc"/>
    <rect x="212" y="270" width="1020" height="32" rx="5" fill="#f7f9fc"/>

    <!-- MTE2 lane -->
    <rect x="212" y="198" width="96" height="28" rx="5" fill="#dceaff" stroke="#8fb8ec"/><text x="260" y="217" font-size="12" font-weight="700" fill="#1d4f8c" text-anchor="middle">MTE2 #0</text>
    <rect x="312" y="198" width="96" height="28" rx="5" fill="#dceaff" stroke="#8fb8ec"/><text x="360" y="217" font-size="12" font-weight="700" fill="#1d4f8c" text-anchor="middle">MTE2 #1</text>
    <rect x="412" y="198" width="96" height="28" rx="5" fill="#dceaff" stroke="#8fb8ec"/><text x="460" y="217" font-size="12" font-weight="700" fill="#1d4f8c" text-anchor="middle">MTE2 #2</text>

    <!-- Vector lane -->
    <rect x="312" y="235" width="96" height="28" rx="5" fill="#e9e2fa" stroke="#bda9ec"/><text x="360" y="254" font-size="12" font-weight="700" fill="#5b3b9e" text-anchor="middle">Vec #0</text>
    <rect x="412" y="235" width="96" height="28" rx="5" fill="#e9e2fa" stroke="#bda9ec"/><text x="460" y="254" font-size="12" font-weight="700" fill="#5b3b9e" text-anchor="middle">Vec #1</text>
    <rect x="512" y="235" width="96" height="28" rx="5" fill="#e9e2fa" stroke="#bda9ec"/><text x="560" y="254" font-size="12" font-weight="700" fill="#5b3b9e" text-anchor="middle">Vec #2</text>

    <!-- MTE3 lane -->
    <rect x="412" y="272" width="96" height="28" rx="5" fill="#fff0d4" stroke="#e5b869"/><text x="460" y="291" font-size="12" font-weight="700" fill="#8c5210" text-anchor="middle">MTE3 #0</text>
    <rect x="512" y="272" width="96" height="28" rx="5" fill="#fff0d4" stroke="#e5b869"/><text x="560" y="291" font-size="12" font-weight="700" fill="#8c5210" text-anchor="middle">MTE3 #1</text>
    <rect x="612" y="272" width="96" height="28" rx="5" fill="#fff0d4" stroke="#e5b869"/><text x="660" y="291" font-size="12" font-weight="700" fill="#8c5210" text-anchor="middle">MTE3 #2</text>

    <!-- Saved T_hidden callout -->
    <rect x="724" y="200" width="484" height="98" rx="9" fill="#f2fbf7" stroke="#7ec5af" stroke-width="1.6" stroke-dasharray="5 3"/>
    <text x="966" y="228" font-size="14" font-weight="700" fill="#1d6b55" text-anchor="middle">为三段流水提供重叠条件（实际隐藏取决于各段耗时与依赖）</text>
    <text x="966" y="254" font-size="12.5" fill="#203d5d" text-anchor="middle">• 需防多余 PipeBarrier&lt;PIPE_ALL&gt; 打断流水</text>
    <text x="966" y="278" font-size="12.5" fill="#a32929" text-anchor="middle">• 反例：提交 06 用 multibuffer=False 保证同槽覆盖顺序</text>

    <!-- LOWER CARD: Cross-stream CV Overlap (Commit 07 - STRICTLY VERIFIED AGAINST sfa_v1.py:1556-1573) -->
    <rect x="24" y="348" width="1232" height="214" rx="14" fill="#ffffff"/>
    <text x="44" y="378" font-size="16.5" font-weight="700" fill="#203d5d">二、片内主辅流错峰（提交 07，按 sfa_v1.py:1546–1573）：K 走主流、Q 走辅流，段末汇合再做 K C8</text>

    <!-- Left: Native two-window -->
    <rect x="44" y="394" width="588" height="150" rx="10" fill="#f7faff" stroke="#93b9ea" stroke-width="1.5"/>
    <text x="62" y="418" font-size="13.5" font-weight="700" fill="#1d4f8c">Native 路径：两段错峰（主流跑 K，辅流跑 Q）</text>

    <text x="62" y="456" font-size="12.5" font-weight="700" fill="#203d5d">主流</text>
    <rect x="104" y="434" width="150" height="34" rx="6" fill="#dceaff" stroke="#8fb8ec"/><text x="179" y="456" font-size="12" font-weight="700" fill="#1d4f8c" text-anchor="middle">K 投影 MatMul (C)</text>
    <line x1="258" y1="451" x2="280" y2="451" stroke="#6887a7" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="286" y="434" width="160" height="34" rx="6" fill="#d9f1e9" stroke="#7ec5af"/><text x="366" y="456" font-size="12" font-weight="700" fill="#1d6b55" text-anchor="middle">K Norm + RoPE (V)</text>
    <line x1="450" y1="451" x2="496" y2="451" stroke="#6887a7" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="502" y="434" width="114" height="34" rx="6" fill="#fff0d4" stroke="#e5b869"/><text x="559" y="456" font-size="12" font-weight="700" fill="#8c5210" text-anchor="middle">K C8 量化</text>

    <text x="62" y="510" font-size="12.5" font-weight="700" fill="#5b3b9e">辅流</text>
    <rect x="104" y="488" width="150" height="34" rx="6" fill="#e9e2fa" stroke="#bda9ec"/><text x="179" y="510" font-size="12" font-weight="700" fill="#5b3b9e" text-anchor="middle">Q 静态量化 (V)</text>
    <line x1="258" y1="505" x2="280" y2="505" stroke="#6887a7" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="286" y="488" width="160" height="34" rx="6" fill="#dceaff" stroke="#8fb8ec"/><text x="366" y="510" font-size="12" font-weight="700" fill="#1d4f8c" text-anchor="middle">Q MatMul (C)</text>

    <!-- Sync arrows: aux waits main after K proj; main waits aux before K C8 -->
    <path d="M 244 468 L 274 494" fill="none" stroke="#a32929" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-r)"/>
    <path d="M 446 505 L 478 505 L 478 462 L 496 462" fill="none" stroke="#a32929" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-r)"/>
    <text x="488" y="534" font-size="11" font-weight="700" fill="#a32929" text-anchor="middle">主流 wait 辅流后再做 K C8</text>

    <!-- Right: MLAPO single-window trade-off -->
    <rect x="648" y="394" width="588" height="150" rx="10" fill="#fffaf0" stroke="#e5b869" stroke-width="1.5"/>
    <text x="666" y="418" font-size="13.5" font-weight="700" fill="#8c5210">MLAPO 路径：Q 量化留在主流（免 1 次切流），Q MatMul 仍走辅流</text>

    <text x="666" y="456" font-size="12.5" font-weight="700" fill="#203d5d">主流</text>
    <rect x="708" y="434" width="150" height="34" rx="6" fill="#fff0d4" stroke="#e5b869"/><text x="783" y="456" font-size="12" font-weight="700" fill="#8c5210" text-anchor="middle">Q 量化留主流 (V)</text>
    <line x1="862" y1="451" x2="884" y2="451" stroke="#6887a7" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="890" y="434" width="160" height="34" rx="6" fill="#d9f1e9" stroke="#7ec5af"/><text x="970" y="456" font-size="12" font-weight="700" fill="#1d6b55" text-anchor="middle">K Norm + RoPE (V)</text>
    <line x1="1054" y1="451" x2="1100" y2="451" stroke="#6887a7" stroke-width="1.8" marker-end="url(#arr)"/>
    <rect x="1106" y="434" width="114" height="34" rx="6" fill="#fff0d4" stroke="#e5b869"/><text x="1163" y="456" font-size="12" font-weight="700" fill="#8c5210" text-anchor="middle">K C8 量化</text>

    <text x="666" y="510" font-size="12.5" font-weight="700" fill="#5b3b9e">辅流</text>
    <rect x="708" y="488" width="150" height="34" rx="6" fill="#edf3f9"/><text x="783" y="510" font-size="11.5" fill="#526d88" text-anchor="middle">不切流（省 handoff）</text>
    <rect x="890" y="488" width="160" height="34" rx="6" fill="#dceaff" stroke="#8fb8ec"/><text x="970" y="510" font-size="12" font-weight="700" fill="#1d4f8c" text-anchor="middle">Q MatMul (C)</text>

    <!-- Sync arrows -->
    <path d="M 852 468 L 884 494" fill="none" stroke="#a32929" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arr-r)"/>
    <path d="M 1050 505 L 1082 505 L 1082 462 L 1100 462" fill="none" stroke="#a32929" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arr-r)"/>
    <text x="1092" y="534" font-size="11" font-weight="700" fill="#a32929" text-anchor="middle">主流 wait 辅流后再做 K C8</text>
  </g>
</svg>
